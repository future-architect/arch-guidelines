name: ShareCount

# 共有ボタンの数字（はてなブックマーク #425 ／ X #490）のキャッシュを取り直して
# main へ push する。push でそのまま GHPages が走るので、サイトの数字も日次で更新される。
# ビルド側は外部に触らないため、取得先の障害で PR の CI は落ちない。
on:
  schedule:
    # 9:00 JST
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-count:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - name: Update Hatena bookmark counts
        run: npm run hatebu
      - name: Update X counts
        run: npm run xcount
      - name: Commit and push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .vitepress/hatebu_count_cache.json .vitepress/x_count_cache.json
          # 数字が動いていない日は何もしない
          git diff --cached --quiet && exit 0
          git commit -m "共有ボタンの数字のキャッシュを更新"
          git push
