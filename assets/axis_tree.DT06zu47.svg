  <text x="698" y="502.0" font-size="12" fill="#6a7179">確実性</text>
  <rect x="352" y="552.0" width="980" height="132" rx="10" fill="#ffffff" stroke="#a6c6da" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="364" y="582.0" font-size="15" font-weight="700" fill="#1b2026">重みの軸<tspan font-size="13" font-weight="400" fill="#4a5568">　分けた行ごとに添え、相手がどう重みを置くかの向きを見る。相手のモードが明確なら、大分類にも使える</tspan></text>
  <rect x="364.0" y="596.0" width="181.6" height="76" rx="8" fill="#e4eef5" stroke="#a6c6da" stroke-width="1.5"/>
  <text x="374.0" y="621.0" font-size="15" font-weight="700" fill="#1b2026">攻め・守り</text>
  <text x="374.0" y="643.0" font-size="12" fill="#6a7179">事業を伸ばすか、リスクを</text>
  <text x="374.0" y="659.0" font-size="12" fill="#6a7179">抑えるか</text>
  <rect x="557.6" y="596.0" width="181.6" height="76" rx="8" fill="#e4eef5" stroke="#a6c6da" stroke-width="1.5"/>
  <text x="567.6" y="621.0" font-size="15" font-weight="700" fill="#1b2026">短期・中期・長期</text>
  <text x="567.6" y="643.0" font-size="12" fill="#6a7179">いつ効いてくるか</text>
  <rect x="751.2" y="596.0" width="181.6" height="76" rx="8" fill="#e4eef5" stroke="#a6c6da" stroke-width="1.5"/>
  <text x="761.2" y="621.0" font-size="15" font-weight="700" fill="#1b2026">フェーズ</text>
  <text x="761.2" y="643.0" font-size="12" fill="#6a7179">設計・構築・保守運用。</text>
  <text x="761.2" y="659.0" font-size="12" fill="#6a7179">どの工程で効くか</text>
  <rect x="944.8" y="596.0" width="181.6" height="76" rx="8" fill="#e4eef5" stroke="#a6c6da" stroke-width="1.5"/>
  <text x="954.8" y="621.0" font-size="15" font-weight="700" fill="#1b2026">戦略・戦術</text>
  <text x="954.8" y="643.0" font-size="12" fill="#6a7179">事業の方向を決めるものか、</text>
  <text x="954.8" y="659.0" font-size="12" fill="#6a7179">実行の巧拙か</text>
  <rect x="1138.4" y="596.0" width="181.6" height="76" rx="8" fill="#e4eef5" stroke="#a6c6da" stroke-width="1.5"/>
  <text x="1148.4" y="621.0" font-size="15" font-weight="700" fill="#1b2026">内部・外部</text>
  <text x="1148.4" y="643.0" font-size="12" fill="#6a7179">社内に効くか、社外に効くか</text>
  <rect x="16" y="552.0" width="24" height="18" rx="4" fill="#e4eef5" stroke="#a6c6da" stroke-width="1.5"/>
  <text x="50" y="566.0" font-size="14" fill="#4a5568">大分類に使えそうな軸</text>
  <rect x="16" y="578.0" width="24" height="18" rx="4" fill="#fbfaf7" stroke="#d7dce1" stroke-width="1.5"/>
  <text x="50" y="592.0" font-size="14" fill="#4a5568">小分類・中分類に使えそうな軸</text>
  <rect x="16" y="604.0" width="24" height="18" rx="4" fill="#ffffff" stroke="#c0c7ce" stroke-width="1.5"/>
  <text x="50" y="618.0" font-size="14" fill="#4a5568">分け方の構造</text>
