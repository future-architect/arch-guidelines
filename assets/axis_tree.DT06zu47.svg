  <text x="362" y="41.0" font-size="15" font-weight="700" fill="#4a5568">技術制約</text>
  <text x="362" y="63.0" font-size="12" fill="#6a7179">相手の既存環境に</text>
  <text x="362" y="79.0" font-size="12" fill="#6a7179">載らない、自分たちの</text>
  <text x="362" y="95.0" font-size="12" fill="#6a7179">技術方針に反する。</text>
  <text x="362" y="111.0" font-size="12" fill="#6a7179">例: 閉域網でつなが</text>
  <text x="362" y="127.0" font-size="12" fill="#6a7179">るのは AWS だけ</text>
  <rect x="352" y="150.0" width="140" height="92" rx="8" fill="#ffffff" stroke="#c0c7ce" stroke-width="1.5"/>
  <text x="362" y="175.0" font-size="15" font-weight="700" fill="#4a5568">ビジネス制約</text>
  <text x="362" y="197.0" font-size="12" fill="#6a7179">相手の方針、法規制、</text>
  <text x="362" y="213.0" font-size="12" fill="#6a7179">契約。例: IT 方針で</text>
  <text x="362" y="229.0" font-size="12" fill="#6a7179">GCP は使えない</text>
  <rect x="184" y="329.0" width="140" height="40" rx="8" fill="#ffffff" stroke="#c0c7ce" stroke-width="1.5"/>
