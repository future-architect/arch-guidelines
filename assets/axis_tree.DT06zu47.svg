  <text x="1202" y="404.0" font-size="12" fill="#6a7179">誤操作、内部不正、</text>
  <text x="1202" y="420.0" font-size="12" fill="#6a7179">コンプライアンス</text>
  <rect x="1024" y="382.0" width="140" height="60" rx="8" fill="#fbfaf7" stroke="#d7dce1" stroke-width="1.5"/>
