  <text x="698" y="416.0" font-size="12" fill="#6a7179">運用費用、体制</text>
  <rect x="688" y="439.0" width="140" height="76" rx="8" fill="#e4eef5" stroke="#a6c6da" stroke-width="1.5"/>
  <text x="698" y="464.0" font-size="15" font-weight="700" fill="#1b2026">D 納期</text>
