  <text x="362" y="401.0" font-size="12" fill="#6a7179">借りる。題材と</text>
  <text x="362" y="417.0" font-size="12" fill="#6a7179">無関係に先にある</text>
  <text x="362" y="433.0" font-size="12" fill="#6a7179">既成の軸を当てる</text>
