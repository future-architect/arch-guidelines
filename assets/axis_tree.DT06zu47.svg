  <text x="530" y="307.0" font-size="12" fill="#6a7179">小分類。相手が</text>
  <text x="530" y="323.0" font-size="12" fill="#6a7179">読める最初の粒度。</text>
  <text x="530" y="339.0" font-size="12" fill="#6a7179">MECE ではない</text>
