<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 325" width="1520" height="325" font-family="Noto Sans CJK JP, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b5f83"/>
    </marker>
  </defs>
  <rect width="1520" height="325" fill="#ffffff"/>
  <rect x="15.0" y="16" width="230.4" height="144" rx="10" fill="#e4eef5" stroke="#a6c6da" stroke-width="2"/>
  <rect x="106.2" y="28" width="48" height="26" rx="13" fill="#2b5f83"/>
  <text x="130.2" y="47" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4-1</text>
  <text x="130.2" y="103.0" font-size="16" font-weight="700" fill="#1b2026" text-anchor="middle">制約で足切りし、</text>
  <text x="130.2" y="127.0" font-size="16" font-weight="700" fill="#1b2026" text-anchor="middle">候補を絞る</text>
  <line x1="247.4" y1="88.0" x2="272.4" y2="88.0" stroke="#2b5f83" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="130.2" y1="160" x2="130.2" y2="194" stroke="#b5562a" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="15.0" y="194" width="230.4" height="117" rx="8" fill="#fbf3ee" stroke="#e2c3b2" stroke-width="1.5"/>
  <text x="31.0" y="220" font-size="14" font-weight="700" fill="#b5562a">躓き</text>
  <text x="31.0" y="250" font-size="14.5" fill="#1b2026">全候補を精緻に</text>
  <text x="31.0" y="273" font-size="14.5" fill="#1b2026">比べようとして破綻する</text>
  <rect x="275.4" y="16" width="230.4" height="144" rx="10" fill="#e4eef5" stroke="#a6c6da" stroke-width="2"/>
