<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 128 1000 622" width="1000" height="622" font-family="Noto Sans CJK JP, sans-serif">
<defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b5f83"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5562a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a7179"/></marker></defs>
<rect y="128" width="1000" height="622" fill="#ffffff"/>
<path d="M500.0 148 L738.0 540 L262.0 540 Z" fill="#e4eef5" stroke="#a6c6da" stroke-width="2" stroke-linejoin="round"/>
<text x="478.0" y="378" font-size="16" letter-spacing="1" fill="#2b5f83" text-anchor="end">相手の価値判断</text>
<rect x="370" y="170" width="260" height="128" rx="14" fill="#ffffff" stroke="#a6c6da" stroke-width="2" stroke-dasharray="9 7"/><text x="398" y="216" font-size="26" font-weight="700" fill="#1b2026">目指す姿</text><text x="398" y="248" font-size="18" fill="#4a5568">そもそも何のためか</text><text x="398" y="278" font-size="16" fill="#b5562a">資料では仮に定めている</text>
<rect x="280" y="410" width="440" height="110" rx="14" fill="#ffffff" stroke="#a6c6da" stroke-width="2"/><text x="308" y="456" font-size="26" font-weight="700" fill="#1b2026">今回の判断の優先度</text><text x="308" y="488" font-size="18" fill="#4a5568">何を優先し、何を諦めるか</text>
<rect x="280" y="600" width="440" height="110" rx="14" fill="#fbfaf7" stroke="#c9d1da" stroke-width="2"/><text x="308" y="646" font-size="26" font-weight="700" fill="#1b2026">技術判断</text><text x="308" y="678" font-size="18" fill="#4a5568">どの案を採るか</text>
<line x1="500.0" y1="526" x2="500.0" y2="592" stroke="#6a7179" stroke-width="3" marker-end="url(#ag)"/>
<text x="514.0" y="566" font-size="16" font-weight="700" fill="#6a7179">従属させる</text>
<rect x="250" y="394" width="500" height="332" rx="20" fill="none" stroke="#2b5f83" stroke-width="2.5" stroke-dasharray="4 6"/>
<g font-size="18" font-weight="700" fill="#2b5f83" text-anchor="end"><text x="236" y="686">資料の範囲</text></g>
<line x1="500.0" y1="306" x2="500.0" y2="388" stroke="#2b5f83" stroke-width="4" marker-end="url(#ab)"/>
<g font-size="17" font-weight="700" fill="#2b5f83" text-anchor="start"><text x="516.0" y="353">判断軸を見つめ直す</text></g>
<rect x="6" y="441.0" width="128" height="48" rx="24" fill="#6a7179"/><text x="70" y="473.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">自分たち</text>
<rect x="866" y="441.0" width="128" height="48" rx="24" fill="#2b5f83"/><text x="930" y="473.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">相手</text>
<line x1="110" y1="439.0" x2="364" y2="234.0" stroke="#6a7179" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ag)"/>
<line x1="136" y1="465.0" x2="274" y2="465.0" stroke="#6a7179" stroke-width="3" marker-end="url(#ag)"/>
<line x1="890" y1="439.0" x2="636" y2="234.0" stroke="#2b5f83" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ab)"/>
<line x1="864" y1="465.0" x2="726" y2="465.0" stroke="#2b5f83" stroke-width="3" marker-end="url(#ab)"/>
<g font-size="17" font-weight="700" fill="#b5562a" text-anchor="start"><text x="24" y="222">「もともと、やりたいことは</text><text x="24" y="248">何だったんでしょうか？」</text></g>
<g font-size="17" font-weight="700" fill="#2b5f83" text-anchor="middle"><text x="930" y="235">改めて考える</text></g>
