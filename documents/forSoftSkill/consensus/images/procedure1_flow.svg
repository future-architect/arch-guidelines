  <rect x="464.2" y="28" width="48" height="26" rx="13" fill="#2b5f83"/>
  <text x="488.2" y="47" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1-2</text>
  <text x="488.2" y="103.0" font-size="16" font-weight="700" fill="#1b2026" text-anchor="middle">確認事項と相談事項を区別する</text>
  <line x1="638.0" y1="76.0" x2="663.0" y2="76.0" stroke="#2b5f83" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="488.2" y1="136" x2="488.2" y2="170" stroke="#b5562a" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="340.5" y="170" width="295.5" height="94" rx="8" fill="#fbf3ee" stroke="#e2c3b2" stroke-width="1.5"/>
  <text x="356.5" y="196" font-size="14" font-weight="700" fill="#b5562a">躓き</text>
  <text x="356.5" y="226" font-size="14.5" fill="#1b2026">本来相談すべきことを確認として問い、</text>
  <text x="356.5" y="249" font-size="14.5" fill="#1b2026">相手に答えを求めすぎる</text>
  <rect x="666.0" y="16" width="295.5" height="120" rx="10" fill="#e4eef5" stroke="#a6c6da" stroke-width="2"/>
  <rect x="789.8" y="28" width="48" height="26" rx="13" fill="#2b5f83"/>
  <text x="813.8" y="47" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1-3</text>
  <text x="813.8" y="103.0" font-size="16" font-weight="700" fill="#1b2026" text-anchor="middle">相手側のキーマンを確かめる</text>
  <line x1="963.5" y1="76.0" x2="988.5" y2="76.0" stroke="#2b5f83" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="813.8" y1="136" x2="813.8" y2="170" stroke="#b5562a" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="666.0" y="170" width="295.5" height="94" rx="8" fill="#fbf3ee" stroke="#e2c3b2" stroke-width="1.5"/>
  <text x="682.0" y="196" font-size="14" font-weight="700" fill="#b5562a">躓き</text>
  <text x="682.0" y="226" font-size="14.5" fill="#1b2026">だれ向けの資料かを決めないまま作る。</text>
  <text x="682.0" y="249" font-size="14.5" fill="#1b2026">担当外の相手に判断を求める</text>
  <rect x="991.5" y="16" width="295.5" height="120" rx="10" fill="#e4eef5" stroke="#a6c6da" stroke-width="2"/>
  <rect x="1115.2" y="28" width="48" height="26" rx="13" fill="#2b5f83"/>
  <text x="1139.2" y="47" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1-4</text>
  <text x="1139.2" y="91.0" font-size="16" font-weight="700" fill="#1b2026" text-anchor="middle">影響の大きさや依存関係から</text>
  <text x="1139.2" y="115.0" font-size="16" font-weight="700" fill="#1b2026" text-anchor="middle">優先度付けする</text>
  <line x1="1289.0" y1="76.0" x2="1314.0" y2="76.0" stroke="#2b5f83" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="1139.2" y1="136" x2="1139.2" y2="170" stroke="#b5562a" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="991.5" y="170" width="295.5" height="94" rx="8" fill="#fbf3ee" stroke="#e2c3b2" stroke-width="1.5"/>
  <text x="1007.5" y="196" font-size="14" font-weight="700" fill="#b5562a">躓き</text>
  <text x="1007.5" y="226" font-size="14.5" fill="#1b2026">話しやすい議題から始め、前提になる</text>
  <text x="1007.5" y="249" font-size="14.5" fill="#1b2026">議題が未決だと後で気づく</text>
  <rect x="1317.0" y="16" width="188" height="120" rx="10" fill="#2b5f83" stroke="#2b5f83" stroke-width="2"/>
  <text x="1411.0" y="47" font-size="14" font-weight="700" fill="#ffffff" fill-opacity="0.8" text-anchor="middle">アウトプット</text>
  <text x="1411.0" y="91.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">決めたいことの一覧</text>
  <text x="1411.0" y="115.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">決める順序</text>
