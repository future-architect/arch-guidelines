  <text x="162.8" y="103.0" font-size="16" font-weight="700" fill="#1b2026" text-anchor="middle">検討課題を分解してタスク化する</text>
  <line x1="312.5" y1="76.0" x2="337.5" y2="76.0" stroke="#2b5f83" stroke-width="2.5" marker-end="url(#a)"/>
