<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 302" width="1520" height="302" font-family="Noto Sans CJK JP, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b5f83"/>
    </marker>
  </defs>
  <rect width="1520" height="302" fill="#ffffff"/>
  <rect x="15.0" y="16" width="295.5" height="144" rx="10" fill="#e4eef5" stroke="#a6c6da" stroke-width="2"/>
  <rect x="138.8" y="28" width="48" height="26" rx="13" fill="#2b5f83"/>
  <text x="162.8" y="47" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">8-1</text>
  <text x="162.8" y="103.0" font-size="16" font-weight="700" fill="#1b2026" text-anchor="middle">背景や前提がすり合っているか</text>
  <text x="162.8" y="127.0" font-size="16" font-weight="700" fill="#1b2026" text-anchor="middle">確認する</text>
  <line x1="312.5" y1="88.0" x2="337.5" y2="88.0" stroke="#2b5f83" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="162.8" y1="160" x2="162.8" y2="194" stroke="#b5562a" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="15.0" y="194" width="295.5" height="94" rx="8" fill="#fbf3ee" stroke="#e2c3b2" stroke-width="1.5"/>
  <text x="31.0" y="220" font-size="14" font-weight="700" fill="#b5562a">躓き</text>
  <text x="31.0" y="250" font-size="14.5" fill="#1b2026">前提が未決のまま話を進め、</text>
  <text x="31.0" y="273" font-size="14.5" fill="#1b2026">決めたことが後で覆る</text>
  <rect x="340.5" y="16" width="295.5" height="144" rx="10" fill="#e4eef5" stroke="#a6c6da" stroke-width="2"/>
  <rect x="464.2" y="28" width="48" height="26" rx="13" fill="#2b5f83"/>
  <text x="488.2" y="47" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">8-2</text>
  <text x="488.2" y="115.0" font-size="16" font-weight="700" fill="#1b2026" text-anchor="middle">相手の反応から、真意を推し量る</text>
  <line x1="638.0" y1="88.0" x2="663.0" y2="88.0" stroke="#2b5f83" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="488.2" y1="160" x2="488.2" y2="194" stroke="#b5562a" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="340.5" y="194" width="295.5" height="94" rx="8" fill="#fbf3ee" stroke="#e2c3b2" stroke-width="1.5"/>
  <text x="356.5" y="220" font-size="14" font-weight="700" fill="#b5562a">躓き</text>
  <text x="356.5" y="250" font-size="14.5" fill="#1b2026">反応をその場の賛否として受け取り、</text>
  <text x="356.5" y="273" font-size="14.5" fill="#1b2026">どの判断基準が効いたかを確かめない</text>
  <rect x="666.0" y="16" width="295.5" height="144" rx="10" fill="#e4eef5" stroke="#a6c6da" stroke-width="2"/>
  <rect x="789.8" y="28" width="48" height="26" rx="13" fill="#2b5f83"/>
  <text x="813.8" y="47" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">8-3</text>
  <text x="813.8" y="91.0" font-size="16" font-weight="700" fill="#1b2026" text-anchor="middle">緩和策を添えて、浮上した案の</text>
  <text x="813.8" y="115.0" font-size="16" font-weight="700" fill="#1b2026" text-anchor="middle">弱みやリスクが許容できるか</text>
  <text x="813.8" y="139.0" font-size="16" font-weight="700" fill="#1b2026" text-anchor="middle">確認する</text>
  <line x1="963.5" y1="88.0" x2="988.5" y2="88.0" stroke="#2b5f83" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="813.8" y1="160" x2="813.8" y2="194" stroke="#b5562a" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="666.0" y="194" width="295.5" height="94" rx="8" fill="#fbf3ee" stroke="#e2c3b2" stroke-width="1.5"/>
  <text x="682.0" y="220" font-size="14" font-weight="700" fill="#b5562a">躓き</text>
  <text x="682.0" y="250" font-size="14.5" fill="#1b2026">許容できないリスクを説得可能と</text>
  <text x="682.0" y="273" font-size="14.5" fill="#1b2026">勘違いし、時間を浪費する</text>
  <rect x="991.5" y="16" width="188" height="144" rx="10" fill="#2b5f83" stroke="#2b5f83" stroke-width="2"/>
  <text x="1085.5" y="47" font-size="14" font-weight="700" fill="#ffffff" fill-opacity="0.8" text-anchor="middle">アウトプット</text>
  <text x="1085.5" y="103.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">相手の価値基準</text>
  <text x="1085.5" y="127.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">受け入れる弱み</text>
</svg>
