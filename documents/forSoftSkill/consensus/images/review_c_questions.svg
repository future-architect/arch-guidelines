  <text x="877.0" y="68.0" font-size="19" font-weight="700" fill="#1b2026" text-anchor="middle">アンチパターンな声掛け</text>
  <rect x="1173.0" y="15" width="370.0" height="44" fill="#adc7dc"/>
  <text x="1358.0" y="45.0" font-size="19" font-weight="700" fill="#1b2026" text-anchor="middle">発生しやすい成果物の段階</text>
  <rect x="1173.0" y="63" width="89.5" height="44" fill="#adc7dc"/>
  <text x="1217.8" y="93.0" font-size="18" font-weight="700" fill="#1b2026" text-anchor="middle">案出し</text>
  <rect x="1266.5" y="63" width="89.5" height="44" fill="#adc7dc"/>
  <text x="1311.2" y="93.0" font-size="18" font-weight="700" fill="#1b2026" text-anchor="middle">比較表</text>
