<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 592" width="1560" height="592" font-family="Noto Sans CJK JP, sans-serif">
  <rect width="1560" height="592" fill="#ffffff"/>
  <rect x="15.0" y="15" width="120.0" height="92" fill="#adc7dc"/>
  <text x="75.0" y="68.0" font-size="19" font-weight="700" fill="#1b2026" text-anchor="middle">場面</text>
