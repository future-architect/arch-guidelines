# 表記ゆれと、使わないと決めた語の辞書。textlint-rule-prh が読む。
# 語を足すときは、引用や資料の文言として本文に出てこないかを先に確認する。
version: 1
rules:
  # 比喩的な操作の語を避け、何をするかで書く
  - expected: まとめる
    patterns:
      - 畳む
  - expected: 1つにまとめられる
    patterns:
      - 畳める

  # 相手任せの表現。プロとして推奨案を示す書き方に寄せる
  - expected: 相手と合意する
    patterns:
      - 相手に決めてもらう
      - 相手に委ねる
  - expected: 相手の価値判断が要る
    patterns:
      - 相手しか決められない

  # 「立てる」は何をするのかがぼやける。「仮説を立てる」の慣用句だけは残す
  - expected: 作る
    pattern: /(?<!(組み|組|見|論理|仮説を|役|取り|引き|目|腹|筋|系|順|際|証|申し|仕))立て(る|た|ず|て|ない|られ|よう|方|れば|ます)/

  # 案の良し悪しは「取るもの・捨てるもの」と言わず、メリット・デメリット（リスク）と書く
  - expected: メリット
    patterns:
      - 取るもの
  - expected: デメリット
    patterns:
      - 捨てるもの

  # 比較表の ❌ は事実上対応できないときだけに付ける。負担の大きさは ⚠️ と数値で示す
  - expected: ❌は事実上対応できない
    patterns:
      - ❌は対応できないか負担が大きい

  # 相手に見せる文では、案を外すことを口語で言わない
  - expected: 除外
    patterns:
      - 足切り

  # 「強める」は程度がぼやける。現行との比較では「強化する」と書く
  - expected: より強化する
    patterns:
      - より強める

  # 相手の審査や要求への対応は「応じる」と書く
  - expected: 応じない
    patterns:
      - 応えない

  # 相談を切り出す文は、相手にお願いする形にする
  - expected: を相談させてください
    patterns:
      - をご相談します

  # 自分たちの会社は「開発会社」と書く
  - expected: 開発会社
    patterns:
      - ベンダー

  # リスクは断定せず、懸念として書く
  - expected: に繋がる懸念があります
    patterns:
      - に表れます
