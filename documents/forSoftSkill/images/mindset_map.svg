<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 358" width="1200" height="358" font-family="Noto Sans CJK JP, sans-serif">
  <rect width="1200" height="358" fill="#ffffff"/>
  <rect x="77.0" y="15" width="549.0" height="46" fill="#e4eef5"/>
  <text x="354.0" y="46.0" font-size="19" font-weight="700" fill="#1b2026" text-anchor="middle">内部（自分たち）</text>
  <rect x="636.0" y="15" width="549.0" height="46" fill="#e4eef5"/>
  <text x="908.0" y="46.0" font-size="19" font-weight="700" fill="#1b2026" text-anchor="middle">外部（相手）</text>
  <rect x="15" y="71.0" width="52" height="131.0" fill="#e4eef5"/>
  <text x="41.0" y="128.5" font-size="21" font-weight="700" fill="#1b2026" text-anchor="middle">結</text>
  <text x="41.0" y="158.5" font-size="21" font-weight="700" fill="#1b2026" text-anchor="middle">論</text>
  <rect x="15" y="212.0" width="52" height="131.0" fill="#e4eef5"/>
  <text x="41.0" y="269.5" font-size="21" font-weight="700" fill="#1b2026" text-anchor="middle">根</text>
  <text x="41.0" y="299.5" font-size="21" font-weight="700" fill="#1b2026" text-anchor="middle">拠</text>
  <rect x="105.0" y="99.0" width="124" height="40" rx="20" fill="#2b5f83"/>
  <text x="167.0" y="127.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">設計判断</text>
  <text x="243.0" y="126.0" font-size="19" font-weight="700" fill="#2b5f83" text-anchor="start">Design Decision</text>
  <text x="105.0" y="179.0" font-size="20" fill="#1b2026" text-anchor="start">①決めきる覚悟を持ち、推奨案を仮説として持つ</text>
  <rect x="659.0" y="99.0" width="146" height="40" rx="20" fill="#2b5f83"/>
  <text x="732.0" y="127.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">リスク受容</text>
  <text x="819.0" y="126.0" font-size="19" font-weight="700" fill="#2b5f83" text-anchor="start">Risk Acceptance</text>
  <text x="659.0" y="179.0" font-size="20" fill="#1b2026" text-anchor="start">③相手も不確実性の中で決めている</text>
  <rect x="105.0" y="235.0" width="80" height="40" rx="20" fill="#2b5f83"/>
  <text x="145.0" y="263.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">検証</text>
  <text x="199.0" y="262.0" font-size="19" font-weight="700" fill="#2b5f83" text-anchor="start">Verification</text>
  <text x="105.0" y="315.0" font-size="20" fill="#1b2026" text-anchor="start">②技術の評価の正しさは自分たちの責任領域</text>
  <rect x="659.0" y="235.0" width="146" height="40" rx="20" fill="#2b5f83"/>
  <text x="732.0" y="263.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">妥当性確認</text>
  <text x="819.0" y="262.0" font-size="19" font-weight="700" fill="#2b5f83" text-anchor="start">Validation</text>
  <text x="659.0" y="315.0" font-size="20" fill="#1b2026" text-anchor="start">④相手の言葉に翻訳するのは自分たちの仕事</text>
  <line x1="631.0" y1="71.0" x2="631.0" y2="343.0" stroke="#2b5f83" stroke-width="2.5"/>
  <line x1="77.0" y1="207.0" x2="1185.0" y2="207.0" stroke="#2b5f83" stroke-width="2.5"/>
</svg>
