<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 325" width="1520" height="325" font-family="Noto Sans CJK JP, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b5f83"/>
    </marker>
  </defs>
  <rect width="1520" height="325" fill="#ffffff"/>
  <rect x="15.0" y="16" width="295.5" height="144" rx="10" fill="#e4eef5" stroke="#a6c6da" stroke-width="2"/>
  <rect x="138.8" y="28" width="48" height="26" rx="13" fill="#2b5f83"/>
  <text x="162.8" y="47" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">7-1</text>
  <text x="162.8" y="91.0" font-size="16" font-weight="700" fill="#1b2026" text-anchor="middle">推奨案と論点、背景、案の集合、</text>
  <text x="162.8" y="115.0" font-size="16" font-weight="700" fill="#1b2026" text-anchor="middle">受け入れる弱みの順にストーリーを</text>
  <text x="162.8" y="139.0" font-size="16" font-weight="700" fill="#1b2026" text-anchor="middle">組み立てる</text>
  <line x1="312.5" y1="88.0" x2="337.5" y2="88.0" stroke="#2b5f83" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="162.8" y1="160" x2="162.8" y2="194" stroke="#b5562a" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="15.0" y="194" width="295.5" height="117" rx="8" fill="#fbf3ee" stroke="#e2c3b2" stroke-width="1.5"/>
  <text x="31.0" y="220" font-size="14" font-weight="700" fill="#b5562a">躓き</text>
  <text x="31.0" y="250" font-size="14.5" fill="#1b2026">表をどう作ったかから説明し、</text>
  <text x="31.0" y="273" font-size="14.5" fill="#1b2026">相手が「今何の時間？」と迷子になる。</text>
  <text x="31.0" y="296" font-size="14.5" fill="#1b2026">推奨案だけ示し、弱みを伏せる</text>
  <rect x="340.5" y="16" width="295.5" height="144" rx="10" fill="#e4eef5" stroke="#a6c6da" stroke-width="2"/>
  <rect x="464.2" y="28" width="48" height="26" rx="13" fill="#2b5f83"/>
  <text x="488.2" y="47" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">7-2</text>
  <text x="488.2" y="103.0" font-size="16" font-weight="700" fill="#1b2026" text-anchor="middle">相手の反応を予想し、疑問が</text>
  <text x="488.2" y="127.0" font-size="16" font-weight="700" fill="#1b2026" text-anchor="middle">出そうな箇所には補足を入れる</text>
  <line x1="638.0" y1="88.0" x2="663.0" y2="88.0" stroke="#2b5f83" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="488.2" y1="160" x2="488.2" y2="194" stroke="#b5562a" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="340.5" y="194" width="295.5" height="117" rx="8" fill="#fbf3ee" stroke="#e2c3b2" stroke-width="1.5"/>
  <text x="356.5" y="220" font-size="14" font-weight="700" fill="#b5562a">躓き</text>
  <text x="356.5" y="250" font-size="14.5" fill="#1b2026">想定していない質問で止まり、</text>
  <text x="356.5" y="273" font-size="14.5" fill="#1b2026">持ち帰りになる</text>
  <rect x="666.0" y="16" width="295.5" height="144" rx="10" fill="#e4eef5" stroke="#a6c6da" stroke-width="2"/>
  <rect x="789.8" y="28" width="48" height="26" rx="13" fill="#2b5f83"/>
  <text x="813.8" y="47" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">7-3</text>
  <text x="813.8" y="103.0" font-size="16" font-weight="700" fill="#1b2026" text-anchor="middle">相手の負荷と時間の制約から、</text>
  <text x="813.8" y="127.0" font-size="16" font-weight="700" fill="#1b2026" text-anchor="middle">伝え方を計画する</text>
  <line x1="963.5" y1="88.0" x2="988.5" y2="88.0" stroke="#2b5f83" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="813.8" y1="160" x2="813.8" y2="194" stroke="#b5562a" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="666.0" y="194" width="295.5" height="117" rx="8" fill="#fbf3ee" stroke="#e2c3b2" stroke-width="1.5"/>
  <text x="682.0" y="220" font-size="14" font-weight="700" fill="#b5562a">躓き</text>
  <text x="682.0" y="250" font-size="14.5" fill="#1b2026">一度に話す情報量が多すぎて</text>
  <text x="682.0" y="273" font-size="14.5" fill="#1b2026">相手がついて行けなくなる</text>
  <rect x="991.5" y="16" width="188" height="144" rx="10" fill="#2b5f83" stroke="#2b5f83" stroke-width="2"/>
  <text x="1085.5" y="47" font-size="14" font-weight="700" fill="#ffffff" fill-opacity="0.8" text-anchor="middle">アウトプット</text>
  <text x="1085.5" y="103.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">ストーリー</text>
  <text x="1085.5" y="127.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">伝え方の計画</text>
</svg>
