  </defs>
  <rect width="1800" height="760" fill="#ffffff"/>
  <rect x="15.0" y="16" width="1155.3" height="46" fill="#e4eef5"/>
  <text x="592.7" y="47" font-size="20" font-weight="700" fill="#1b2026" text-anchor="middle">WBS 計画から関わる</text>
  <rect x="15.0" y="80" width="272.3" height="68" rx="10" fill="#2b5f83"/>
  <text x="151.2" y="120.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">準備</text>
  <line x1="289.3" y1="114.0" x2="306.3" y2="114.0" stroke="#2b5f83" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="15.0" y="170.0" width="272.3" height="174" rx="10" fill="#e4eef5" stroke="#a6c6da" stroke-width="2"/>
  <rect x="29.0" y="184.0" width="44" height="26" rx="13" fill="#2b5f83"/>
  <text x="51.0" y="203.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="29.0" y="238.0" font-size="18" font-weight="700" fill="#1b2026">決めなければならないことを</text>
  <text x="29.0" y="263.0" font-size="18" font-weight="700" fill="#1b2026">洗い出す</text>
  <line x1="29.0" y1="282.0" x2="273.3" y2="282.0" stroke="#a6c6da" stroke-width="1"/>
  <text x="29.0" y="306.0" font-size="17" fill="#1b2026">前提を列挙し、WBS と</text>
  <text x="29.0" y="331.0" font-size="17" fill="#1b2026">課題一覧を精緻に作る</text>
  <line x1="151.2" y1="348.0" x2="151.2" y2="367.0" stroke="#2b5f83" stroke-width="2" marker-end="url(#a)"/>
  <rect x="15.0" y="370.0" width="272.3" height="124" rx="10" fill="#e4eef5" stroke="#a6c6da" stroke-width="2"/>
  <rect x="29.0" y="384.0" width="44" height="26" rx="13" fill="#2b5f83"/>
  <text x="51.0" y="403.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="29.0" y="438.0" font-size="18" font-weight="700" fill="#1b2026">落としどころを考える</text>
  <line x1="29.0" y1="457.0" x2="273.3" y2="457.0" stroke="#a6c6da" stroke-width="1"/>
  <text x="29.0" y="481.0" font-size="17" fill="#1b2026">課題一覧に粗く言葉で書く</text>
  <line x1="151.2" y1="498.0" x2="151.2" y2="517.0" stroke="#2b5f83" stroke-width="2" marker-end="url(#a)"/>
  <rect x="15.0" y="520.0" width="272.3" height="124" rx="10" fill="#e4eef5" stroke="#a6c6da" stroke-width="2"/>
  <rect x="29.0" y="534.0" width="44" height="26" rx="13" fill="#2b5f83"/>
  <text x="51.0" y="553.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="29.0" y="588.0" font-size="18" font-weight="700" fill="#1b2026">取りうる案を考える</text>
  <line x1="29.0" y1="607.0" x2="273.3" y2="607.0" stroke="#a6c6da" stroke-width="1"/>
  <text x="29.0" y="631.0" font-size="17" fill="#1b2026">頭の中でやる。手は動かさない</text>
  <rect x="309.3" y="80" width="272.3" height="68" rx="10" fill="#2b5f83"/>
  <text x="445.5" y="108.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">初回打合せ</text>
  <text x="445.5" y="132.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">（計画の頭出し）</text>
  <line x1="583.7" y1="114.0" x2="600.7" y2="114.0" stroke="#2b5f83" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="309.3" y="170.0" width="272.3" height="149" rx="10" fill="#e4eef5" stroke="#a6c6da" stroke-width="2"/>
  <rect x="323.3" y="184.0" width="44" height="26" rx="13" fill="#2b5f83"/>
  <text x="345.3" y="203.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
  <text x="323.3" y="238.0" font-size="18" font-weight="700" fill="#1b2026">相手の反応を引き出す</text>
