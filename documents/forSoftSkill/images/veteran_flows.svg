  <text x="323.3" y="306.0" font-size="17" fill="#1b2026">相手を探る</text>
  <rect x="603.7" y="80" width="272.3" height="68" rx="10" fill="#2b5f83"/>
  <text x="739.8" y="108.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">テーマ別</text>
  <text x="739.8" y="132.0" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1回目</text>
  <line x1="878.0" y1="114.0" x2="895.0" y2="114.0" stroke="#2b5f83" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="603.7" y="170.0" width="272.3" height="174" rx="10" fill="#e4eef5" stroke="#a6c6da" stroke-width="2"/>
