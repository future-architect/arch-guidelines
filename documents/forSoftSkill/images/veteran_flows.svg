  <text x="1232.3" y="263.0" font-size="18" font-weight="700" fill="#1b2026">方を組み立てる</text>
  <line x1="1232.3" y1="282.0" x2="1476.7" y2="282.0" stroke="#a6c6da" stroke-width="1"/>
  <text x="1232.3" y="306.0" font-size="17" fill="#1b2026">この相手はどこなら頷くかを</text>
  <text x="1232.3" y="331.0" font-size="17" fill="#1b2026">先に決める</text>
  <line x1="1354.5" y1="348.0" x2="1354.5" y2="367.0" stroke="#2b5f83" stroke-width="2" marker-end="url(#a)"/>
  <rect x="1218.3" y="370.0" width="272.3" height="199" rx="10" fill="#e4eef5" stroke="#a6c6da" stroke-width="2"/>
  <rect x="1232.3" y="384.0" width="58" height="26" rx="13" fill="#2b5f83"/>
  <text x="1261.3" y="403.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">6、5</text>
  <text x="1232.3" y="438.0" font-size="18" font-weight="700" fill="#1b2026">選択肢と評価軸に遡る</text>
