  <text x="639.7" y="603.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="617.7" y="638.0" font-size="18" font-weight="700" fill="#1b2026">各案を観点ごとに評価する</text>
  <line x1="617.7" y1="657.0" x2="862.0" y2="657.0" stroke="#a6c6da" stroke-width="1"/>
  <text x="617.7" y="681.0" font-size="17" fill="#1b2026">後付けの根拠づけ。AI や</text>
  <text x="617.7" y="706.0" font-size="17" fill="#1b2026">若手に任せる</text>
