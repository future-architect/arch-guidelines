  <rect x="1232.3" y="609.0" width="44" height="26" rx="13" fill="#2b5f83"/>
  <text x="1254.3" y="628.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="1232.3" y="663.0" font-size="18" font-weight="700" fill="#1b2026">各案を観点ごとに評価する</text>
