  <text x="646.7" y="203.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5〜6</text>
  <text x="617.7" y="238.0" font-size="18" font-weight="700" fill="#1b2026">評価軸に組み替え、</text>
  <text x="617.7" y="263.0" font-size="18" font-weight="700" fill="#1b2026">コンセプト別の選択肢を作る</text>
  <line x1="617.7" y1="282.0" x2="862.0" y2="282.0" stroke="#a6c6da" stroke-width="1"/>
  <text x="617.7" y="306.0" font-size="17" fill="#1b2026">探りを受けて、その場で</text>
  <text x="617.7" y="331.0" font-size="17" fill="#1b2026">トップダウンに決める</text>
  <line x1="739.8" y1="348.0" x2="739.8" y2="367.0" stroke="#2b5f83" stroke-width="2" marker-end="url(#a)"/>
  <rect x="603.7" y="370.0" width="272.3" height="174" rx="10" fill="#e4eef5" stroke="#a6c6da" stroke-width="2"/>
  <rect x="617.7" y="384.0" width="44" height="26" rx="13" fill="#2b5f83"/>
  <text x="639.7" y="403.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
  <text x="617.7" y="438.0" font-size="18" font-weight="700" fill="#1b2026">説明用のストーリーと伝え</text>
  <text x="617.7" y="463.0" font-size="18" font-weight="700" fill="#1b2026">方を組み立てる</text>
  <line x1="617.7" y1="482.0" x2="862.0" y2="482.0" stroke="#a6c6da" stroke-width="1"/>
  <text x="617.7" y="506.0" font-size="17" fill="#1b2026">論点と比較案を1枚の</text>
  <text x="617.7" y="531.0" font-size="17" fill="#1b2026">紙にまとめる</text>
  <line x1="739.8" y1="548.0" x2="739.8" y2="567.0" stroke="#2b5f83" stroke-width="2" marker-end="url(#a)"/>
