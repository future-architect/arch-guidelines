  <text x="1232.3" y="531.0" font-size="17" fill="#1b2026">評価軸が揃っているか</text>
  <text x="1232.3" y="556.0" font-size="17" fill="#1b2026">確かめる</text>
  <line x1="1354.5" y1="573.0" x2="1354.5" y2="592.0" stroke="#2b5f83" stroke-width="2" marker-end="url(#a)"/>
